<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>NairaBridge FX</title>
  <style>
    :root {
      --bg: #f6f7f5; --card: #ffffff; --ink: #14201a; --muted: #5d6b63; --line: #e3e8e4;
      --brand: #0b7a4b; --brand-ink: #ffffff; --warn: #9a5b00; --warn-bg: #fff6e5; --err: #b42318; --err-bg: #fdecea; --ok-bg: #e8f6ee;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e1411; --card: #161e1a; --ink: #e9efeb; --muted: #9aa8a0; --line: #26312b;
        --brand: #2fbf7f; --brand-ink: #06140d; --warn: #f2b84b; --warn-bg: #2a2212; --err: #ff8a80; --err-bg: #2c1614; --ok-bg: #12261b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 440px; margin: 0 auto; padding: 20px 16px 48px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 20px; margin: 0 0 4px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
    .muted { color: var(--muted); font-size: 14px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .row:first-of-type { border-top: 0; }
    .row b { text-align: right; }
    .big { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
    button, .btn { display: block; width: 100%; padding: 14px 16px; border-radius: 12px; border: 0; font: 600 16px/1.2 inherit;
      background: var(--brand); color: var(--brand-ink); cursor: pointer; text-align: center; text-decoration: none; margin-top: 10px; }
    button.secondary, .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button:disabled { opacity: .5; cursor: default; }
    .step { display: flex; gap: 10px; align-items: center; margin: 4px 0; font-size: 15px; }
    .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; flex: none; }
    .dot.on { border-color: var(--brand); color: var(--brand); }
    .dot.done { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
    .note { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-top: 12px; }
    .note.warn { background: var(--warn-bg); color: var(--warn); }
    .note.err { background: var(--err-bg); color: var(--err); }
    .note.ok { background: var(--ok-bg); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
    .timer { font-variant-numeric: tabular-nums; font-weight: 700; }
    a { color: var(--brand); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header><div class="logo">₦</div><h1>NairaBridge FX</h1></header>
    <div id="app"><div class="card"><p class="muted">Loading…</p></div></div>
    <p class="muted" style="text-align:center;margin-top:24px">Non-custodial. You sign everything in your own wallet.<br/>Rates from Textile FX on Celo.</p>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
